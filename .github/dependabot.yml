# Dependency updates arrive as pull requests rather than as a chore nobody
# remembers. The repo went about four months without one, which is how a
# security advisory first gets noticed by reading the news.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok

    # Pull requests target `dev`, never `main`. This is the repo's default
    # branch so Dependabot would pick it anyway, but the choice is load-bearing
    # rather than incidental: a ruleset blocks pull requests into `main` from
    # anywhere but `dev`, so a Dependabot pull request that went there would be
    # unmergeable and would sit there being ignored.
    target-branch: dev

    # Enough to keep moving, few enough to read. Anything above the limit
    # simply waits for next week rather than being lost.
    open-pull-requests-limit: 5

    commit-message:
      prefix: chore
      include: scope

    # A package matches the first group it appears in, so the lockstep groups
    # come before the catch-all.
    groups:
      # These two versions are pinned to each other in `package.json` and the
      # lint config extends `next/core-web-vitals`. Bumping one without the
      # other is a red build, so they move as one pull request.
      next:
        patterns:
          - next
          - eslint-config-next

      # React and its types are one runtime. Split across pull requests they
      # produce a window where the types describe a React that is not
      # installed.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

      # Everything else that cannot break the build on its own, as one weekly
      # pull request. Majors are deliberately left out: they need release notes
      # read, so they arrive alone and get reviewed alone.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The workflow's own actions pin to major tags, which stop receiving fixes
  # once the next major ships. Monthly, because they move slowly.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    target-branch: dev
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"
